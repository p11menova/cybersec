name: Secure API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Unit and security regression tests
        run: python -m pytest --cov=secure_api --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/pytest.xml
      - name: HTTP smoke test with curl
        run: python scripts/http_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Scan all application code (all severity levels)
        run: python -m bandit -r secure_api wsgi.py -f json -o reports/bandit.json
      - name: Add scan summary
        if: always()
        run: python scripts/scan_summary.py bandit reports/bandit.json | tee reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sast-bandit
          path: reports/
          retention-days: 30

  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Audit runtime and development dependencies
        run: python -m pip_audit -r requirements-dev.txt --format json --output reports/pip-audit.json
      - name: Add scan summary
        if: always()
        run: python scripts/scan_summary.py pip-audit reports/pip-audit.json | tee reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sca-pip-audit
          path: reports/
          retention-days: 30

  snyk:
    name: SCA - Snyk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --global snyk@1.1308.1
      - run: mkdir -p reports
      - name: Require Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo '::error::Add the SNYK_TOKEN Actions secret. Snyk has NOT run.'
            exit 1
          fi
      - name: Check dependencies (block High and Critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements-dev.txt --package-manager=pip --command=python --severity-threshold=high --json-file-output=reports/snyk.json
      - name: Add scan summary
        if: always()
        run: python scripts/scan_summary.py snyk reports/snyk.json | tee reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sca-snyk
          path: reports/
          retention-days: 30
